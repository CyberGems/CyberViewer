name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm test
  video:
    name: Video Playback Tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Ensure FFmpeg
        shell: pwsh
        run: |
          # Chocolatey can exit 0 while installing nothing when its community
          # feed hiccups ("Unable to find package 'ffmpeg'"). Retry, then fail
          # here so a missing FFmpeg is reported as an environment problem
          # instead of a confusing test failure.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { exit 0 }
            choco install ffmpeg -y --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { exit 0 }
            Start-Sleep -Seconds 15
          }
          Write-Error 'FFmpeg is still unavailable after three install attempts; the video suite cannot run on this runner.'
          exit 1
      - run: npm run test:video
      - name: Upload video test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-test-screenshots
          path: ${{ runner.temp }}/cyberviewer-video-test-*/*.png
          if-no-files-found: ignore
          retention-days: 7
