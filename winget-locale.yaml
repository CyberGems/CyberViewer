ShortDescription: Images, video and audio in one fast window for Windows
Description: CyberViewer opens images, video and audio in one fast Windows window. Drop in a photo or a whole folder, move through thumbnails, zoom into details and run a fullscreen slideshow. Local videos play in media tabs, audio tracks share the same player, and YouTube videos or playlists open in an isolated viewer. Crop, rotate, resize, flip or color-correct a picture on the spot, then copy, print, export it to PDF or set it as wallpaper without opening a full editor. Tabs, favorites, session restore, Windows Explorer integration and scheduled backups to a folder you pick keep the workspace with you. Built with Electron.
