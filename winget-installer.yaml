# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: CyberGems.CyberViewer
PackageVersion: {{VERSION}}
InstallerType: nullsoft
Scope: user
InstallModes:
- interactive
- silent
- silentWithProgress
InstallerSwitches:
  Silent: /S
  SilentWithProgress: /S
UpgradeBehavior: install
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/CyberGems/CyberViewer/releases/download/{{TAG}}/CyberViewer-Setup-{{VERSION}}.exe
  InstallerSha256: {{INSTALLER_HASH}}
ManifestType: installer
ManifestVersion: 1.6.0
